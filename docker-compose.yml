services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragdemo
      CHATBOT_RO_PASSWORD: change-me
    volumes:
      - ./data/structured/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data/structured/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./deploy/initdb/03-roles.sh:/docker-entrypoint-initdb.d/03-roles.sh:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragdemo"]
      interval: 5s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ragdemo
      DATABASE_RO_URL: postgresql://chatbot_ro:change-me@db:5432/ragdemo
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
