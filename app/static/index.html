<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HRC Finance Chatbot</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1f2328; --quiet: #6a6f76; --line: #e3e1dc;
    --accent: #2f5bd3; --accent-soft: #eaf0fd; --warn: #9a5b00; --warn-soft: #fdf3e2;
    --user: #1f2328; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 140px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--quiet); font-size: 13px; }
  .bar { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
         padding: 12px 14px; margin: 14px 0; display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
  .bar label { font-size: 13px; color: var(--quiet); }
  .bar input[type=text] { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; width: 130px; }
  .groups { display: flex; gap: 10px; flex-wrap: wrap; }
  .groups label { color: var(--ink); }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
           background: var(--panel); padding: 6px 12px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .thread { font-size: 13px; color: var(--quiet); }
  .examples { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .examples button { font-size: 13px; padding: 4px 10px; border-radius: 999px; }
  .msg { margin: 14px 0; }
  .q { background: var(--user); color: #fff; padding: 10px 14px; border-radius: 12px 12px 4px 12px;
       margin-left: auto; max-width: 80%; width: fit-content; white-space: pre-wrap; }
  .a { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; font-size: 12px; }
  .pill { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 9px; font-weight: 600; }
  .searched { color: var(--quiet); font-size: 12px; margin-bottom: 8px; }
  .answer { white-space: pre-wrap; }
  .warn { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 6px 10px; margin-top: 10px; font-size: 13px; }
  .cites { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; font-size: 13px; }
  .cite { display: flex; gap: 8px; padding: 2px 0; }
  .tag { font-family: var(--mono); color: var(--accent); font-weight: 600; min-width: 28px; }
  details { margin-top: 8px; font-size: 13px; }
  pre { font-family: var(--mono); font-size: 12px; background: var(--bg); border: 1px solid var(--line);
        border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; }
  .error { color: #b42318; }
  .compose { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); }
  .compose .inner { max-width: 920px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 8px; }
  textarea { flex: 1; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
             resize: none; height: 52px; background: var(--panel); }
  .feedback { margin-top: 8px; display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--quiet); }
  .feedback button { padding: 2px 8px; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>HRC Finance Chatbot</h1>
    <span class="sub">Answers from company documents and the database, with citations</span>
  </header>

  <div class="bar">
    <div><label>User&nbsp;</label><input id="user" type="text" value="demo-user"></div>
    <div class="groups" id="groups">
      <label><input type="checkbox" value="tax" checked> tax</label>
      <label><input type="checkbox" value="banking" checked> banking</label>
      <label><input type="checkbox" value="finance" checked> finance</label>
      <label><input type="checkbox" value="compliance" checked> compliance</label>
    </div>
    <button id="newchat">New conversation</button>
    <span class="thread" id="thread">New conversation</span>
  </div>

  <div class="examples" id="examples">
    <button>What is the deadline to file a SAR?</button>
    <button>How much use tax did we pay to each state in Q2 2026?</button>
    <button>Which 2026 invoices over $50,000 violate the exemption certificate policy?</button>
    <button>Which loans breach the credit policy thresholds, and is each one graded correctly under the policy?</button>
    <button>Tell me more about that.</button>
  </div>

  <div id="log"></div>
</div>

<div class="compose">
  <div class="inner">
    <textarea id="question" placeholder="Ask a finance, tax or banking question... (Enter to send)"></textarea>
    <button class="primary" id="send">Ask</button>
  </div>
</div>

<script>
  const log = document.getElementById("log");
  const box = document.getElementById("question");
  const sendBtn = document.getElementById("send");
  const threadLabel = document.getElementById("thread");
  let threadId = null;

  function esc(text) {
    const d = document.createElement("div");
    d.textContent = text ?? "";
    return d.innerHTML;
  }

  function headers() {
    const groups = [...document.querySelectorAll("#groups input:checked")].map(i => i.value).join(",");
    return {
      "Content-Type": "application/json",
      "X-User-Id": document.getElementById("user").value.trim() || "demo-user",
      "X-User-Groups": groups,
    };
  }

  function resetThread() {
    threadId = null;
    threadLabel.textContent = "New conversation";
    log.innerHTML = "";
  }

  async function rate(messageId, rating, el) {
    const r = await fetch("/v1/feedback", { method: "POST", headers: headers(),
      body: JSON.stringify({ message_id: messageId, rating }) });
    el.textContent = r.status === 204 ? (rating === 1 ? "Thanks, marked helpful" : "Thanks, marked not helpful")
                                      : "Could not save feedback (" + r.status + ")";
  }

  function renderAnswer(data) {
    const cites = data.citations.map(c => {
      const detail = c.tag === "S1" ? "SQL shown below" : esc(c.detail);
      return `<div class="cite"><span class="tag">[${esc(c.tag)}]</span><span>${esc(c.source)} &middot; ${detail}</span></div>`;
    }).join("");
    const warns = data.warnings.map(w => `<div class="warn">${esc(w)}</div>`).join("");
    const sql = data.sql ? `<details><summary>SQL used [S1]</summary><pre>${esc(data.sql)}</pre></details>` : "";
    const searched = data.standalone_question
      ? `<div class="searched">Searched as: ${esc(data.standalone_question)}</div>` : "";
    const el = document.createElement("div");
    el.className = "msg";
    el.innerHTML = `
      <div class="a">
        <div class="meta"><span class="pill">route: ${esc(data.route)}</span>
          <span class="pill">${data.citations.length} source(s)</span></div>
        ${searched}
        <div class="answer">${esc(data.answer)}</div>
        ${warns}
        ${cites ? `<div class="cites">${cites}</div>` : ""}
        ${sql}
        <div class="feedback">Was this helpful?
          <button data-r="1">&#128077;</button><button data-r="-1">&#128078;</button><span></span></div>
      </div>`;
    const note = el.querySelector(".feedback span");
    el.querySelectorAll(".feedback button").forEach(b =>
      b.addEventListener("click", () => rate(data.message_id, Number(b.dataset.r), note)));
    log.appendChild(el);
  }

  async function ask(question) {
    question = question.trim();
    if (!question) return;
    const q = document.createElement("div");
    q.className = "msg";
    q.innerHTML = `<div class="q">${esc(question)}</div>`;
    log.appendChild(q);
    box.value = "";
    sendBtn.disabled = true;
    const waiting = document.createElement("div");
    waiting.className = "msg sub";
    waiting.textContent = "Thinking...";
    log.appendChild(waiting);
    window.scrollTo(0, document.body.scrollHeight);

    try {
      const body = { question };
      if (threadId) body.thread_id = threadId;
      const r = await fetch("/v1/chat", { method: "POST", headers: headers(), body: JSON.stringify(body) });
      waiting.remove();
      if (!r.ok) {
        const e = document.createElement("div");
        e.className = "msg error";
        e.textContent = `Error ${r.status}: ` + (await r.text());
        log.appendChild(e);
      } else {
        const data = await r.json();
        threadId = data.thread_id;
        threadLabel.textContent = "Conversation " + threadId.slice(0, 8);
        renderAnswer(data);
      }
    } catch (err) {
      waiting.remove();
      const e = document.createElement("div");
      e.className = "msg error";
      e.textContent = "Could not reach the app: " + err.message;
      log.appendChild(e);
    }
    sendBtn.disabled = false;
    window.scrollTo(0, document.body.scrollHeight);
  }

  sendBtn.addEventListener("click", () => ask(box.value));
  box.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(box.value); }
  });
  document.getElementById("newchat").addEventListener("click", resetThread);
  document.querySelectorAll("#examples button").forEach(b => b.addEventListener("click", () => ask(b.textContent)));
  document.querySelectorAll("#groups input, #user").forEach(i => i.addEventListener("change", resetThread));
</script>
</body>
</html>
